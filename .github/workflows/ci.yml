name: ci

# Runs on every push, plus on demand. Pull requests are covered by the push that created the branch,
# so there is no pull_request trigger and no duplicate run per push. The macOS matrix was dropped to
# keep minutes down; the same checks run locally via ./scripts/verify.sh, optionally as a pre-push hook.
on:
  workflow_dispatch:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Ensure jq is available (runner scripts require it)
        run: command -v jq >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq jq)
      - run: mvn -B test

  frontend:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
