name: ci

# Runs on pull requests and on pushes to main, plus on demand. A push to a branch with no open pull
# request runs nothing, so work in progress does not spend Actions minutes; opening the pull request
# starts CI, and every later push to that branch re-runs it. The macOS matrix was dropped to keep
# minutes down; the same checks, including the packaged browser suite, run locally via
# ./scripts/verify.sh --e2e.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-minimum:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Verify the supported minimum Python
        run: |
          python3 - <<'PYTEST'
          import sys
          print(sys.version)
          assert sys.version_info[:2] == (3, 9), "Expected Python 3.9 on PATH"
          PYTEST
      - name: Ensure hook fixture tools are available
        run: |
          if ! command -v jq >/dev/null || ! command -v openssl >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends jq openssl
          fi
      - name: Hook smoke and outbox contracts (disposable fixtures)
        run: ./scripts/test-agent-hook.sh
      - name: Evaluation harness contracts (no model calls)
        run: |
          python3 -B -m unittest discover -s scripts/benchmarks/blackbox_memory -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/evaluation -p 'test_*.py'

  backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blackbox_test
          POSTGRES_USER: blackbox_test
          # Disposable CI fixture only; never used for a deployed database.
          POSTGRES_PASSWORD: blackbox_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackbox_test -d blackbox_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SBA_POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/blackbox_test
      SBA_POSTGRES_TEST_USERNAME: blackbox_test
      SBA_POSTGRES_TEST_PASSWORD: blackbox_disposable_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Offline lifecycle rehearsal
        run: python3 -B -m unittest discover -s scripts/lifecycle -p 'test_*.py'
      - name: Evaluation harness contracts (no model calls)
        run: |
          python3 -B -m unittest discover -s scripts/benchmarks/blackbox_memory -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/evaluation -p 'test_*.py'
      - name: Java formatter fixtures (application sources remain unchanged)
        run: python3 -B scripts/format/test_java_format.py
      - name: Ensure jq is available (hook fixtures require it)
        run: command -v jq >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq jq)
      - name: Hook durability and deployment recovery
        run: |
          ./scripts/test-agent-hook.sh
          ./scripts/test-deploy-local.sh
      - name: Cloud startup guard (no Java service or cloud resources)
        run: python3 -B -m unittest discover -s scripts/cloud -p 'cloud_entrypoint_test.py'
      - name: Database snapshot safety (offline fixtures)
        run: python3 -B -m unittest discover -s scripts/storage -p 'test_*.py'
      - name: Demo launcher isolation (no service or model calls)
        run: python3 -B -m unittest discover -s scripts/demo -p 'test_*.py'
      - name: PostgreSQL clients for disposable restore rehearsal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: mvn -B test
      - name: Require database consumer and restore contracts
        run: |
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ('PostgresBackendContractTest', 'AuthenticatedPostgresConsumerContractTest', 'DatabaseRestoreContractTest', 'StreamPositionPostgresTest'):
              report = Path('target/surefire-reports') / f'TEST-dev.nathan.sbaagentic.postgres.{name}.xml'
              suite = ET.parse(report).getroot()
              assert int(suite.get('tests', '0')) > 0, f'{name} did not run'
              assert int(suite.get('skipped', '0')) == 0, f'{name} was skipped'
          evidence_report = Path('target/surefire-reports/TEST-dev.nathan.sbaagentic.memory.internal.adapter.in.web.EvidencePostgresHttpMcpTest.xml')
          evidence_suite = ET.parse(evidence_report).getroot()
          assert int(evidence_suite.get('tests', '0')) > 0, 'Evidence PostgreSQL consumer checks did not run'
          assert int(evidence_suite.get('skipped', '0')) == 0, 'Evidence PostgreSQL consumer checks were skipped'
          for name in ('ProjectlessBraidPostgresHttpTest', 'MeldSchemaPostgresMigrationTest', 'ProjectMeldRedactionPostgresHttpTest'):
              report = Path('target/surefire-reports') / f'TEST-dev.nathan.sbaagentic.project.{name}.xml'
              suite = ET.parse(report).getroot()
              assert int(suite.get('tests', '0')) > 0, f'{name} did not run'
              assert int(suite.get('skipped', '0')) == 0, f'{name} was skipped'
          PYTEST

  frontend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test
      - name: Browser fixture safety tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3 lsof sqlite3
          command -v python3 lsof sqlite3
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Package the current application before the browser startup deadline
        working-directory: .
        run: mvn -B -Pfrontend -DskipTests package
      - name: Packaged Chromium journeys (isolated SQLite, providers disabled)
        run: npm run e2e -- --workers=1 --retries=0 --forbid-only --trace=retain-on-failure --reporter=list,html
      - name: Upload fixture browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-chromium-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
