spring:
  application:
    name: sba-agentic
  sql:
    init:
      mode: always
  ai:
    mcp:
      server:
        name: sba-agentic
        version: 0.2.0
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
  mustache:
    check-template-location: false
  # Local dev recorder: never serve stale UI assets. no-store forces the browser to refetch
  # index.html/app.js/graph.js/styles.css each load, so a rebuilt jar shows up on a plain refresh
  # (no hard-refresh needed) and new JS can never run against a cached old DOM.
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

server:
  port: ${SBA_PORT:8766}
  # Localhost-only by default. Network deployments must enable SBA_AUTH_ENABLED and HTTPS.
  address: ${SBA_BIND_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

sba:
  editor:
    # File navigation is catalog-bound and revalidated on every request. Only fixed,
    # explicitly allowlisted VS Code-compatible CLI binaries can be launched.
    enabled: ${SBA_EDITOR_ENABLED:true}
    command: ${SBA_EDITOR_COMMAND:/Applications/Cursor.app/Contents/Resources/app/bin/code}
    allowlist: ${SBA_EDITOR_ALLOWLIST:/Applications/Cursor.app/Contents/Resources/app/bin/code,/opt/homebrew/bin/cursor,/usr/local/bin/cursor,/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code,/opt/homebrew/bin/code}
    timeout: ${SBA_EDITOR_TIMEOUT:5s}
  local-ai:
    enabled: ${SBA_LOCAL_AI_ENABLED:true}
    base-url: ${SBA_LOCAL_AI_BASE_URL:http://localhost:1234}
    chat-path: ${SBA_LOCAL_AI_CHAT_PATH:/v1/chat/completions}
    model: ${SBA_LOCAL_AI_MODEL:local-model}
    api-key: ${SBA_LOCAL_AI_API_KEY:lm-studio}
    timeout: 30s
    max-tokens: 320
    # Per-request char budget for the local model. Transcripts above this are map-reduced (summarized in
    # windows, then folded) instead of overflowing the context. 8000 chars ~= 2.7k tokens of dense
    # transcript, leaving headroom on a 4096-token context after output + system prompt. Raise for bigger
    # context windows; lower it for a 2k-context model.
    max-input-chars: ${SBA_LOCAL_AI_MAX_INPUT_CHARS:8000}
  summary:
    # external is the default and sends transcript text through the bundled Codex CLI wrapper;
    # `local` is an explicit opt-in for an OpenAI-compatible local server and degrades to a
    # compacted-transcript summary when no model server is running.
    backend: ${SBA_SUMMARY_BACKEND:external}
    external-command: ${SBA_SUMMARY_EXTERNAL_COMMAND:scripts/summarize-with-codex.sh}
    timeout: ${SBA_SUMMARY_TIMEOUT:10m}
  exports:
    # Export is opt-in through the API/UI. The Obsidian target stays listed, but writes are disabled
    # until a directory is configured.
    targets:
      - id: obsidian
        label: Obsidian
        type: markdown-file
        enabled: true
        directory: ${SBA_EXPORT_OBSIDIAN_DIR:}
        template: classpath:/exports/summary-markdown.mustache
        subdirectory-template: "{{month}}"
        filename-template: "{{date}}-{{slug}}-{{shortId}}.md"
  elasticsearch:
    enabled: ${SBA_ELASTICSEARCH_ENABLED:false}
    base-url: ${SBA_ELASTICSEARCH_URL:http://localhost:9200}
    index-name: ${SBA_ELASTICSEARCH_INDEX:sba-agentic-events}
    number-of-replicas: ${SBA_ELASTICSEARCH_REPLICAS:0}
    timeout: 5s
  memory:
    embedding:
      enabled: ${SBA_MEMORY_EMBEDDING_ENABLED:true}
      base-url: ${SBA_MEMORY_EMBEDDING_URL:http://localhost:11434}
      path: ${SBA_MEMORY_EMBEDDING_PATH:/api/embeddings}
      model: ${SBA_MEMORY_EMBEDDING_MODEL:nomic-embed-text}
      dimensions: ${SBA_MEMORY_EMBEDDING_DIMENSIONS:768}
      timeout: 5s
      document-prefix: "${SBA_MEMORY_EMBEDDING_DOCUMENT_PREFIX:search_document: }"
      query-prefix: "${SBA_MEMORY_EMBEDDING_QUERY_PREFIX:search_query: }"
    vector:
      sqlite-vec-path: ${SBA_SQLITE_VEC_PATH:}
    recall:
      relevance-floor: ${SBA_MEMORY_RECALL_RELEVANCE_FLOOR:0.61}
      telemetry:
        project-aliases: ${SBA_RECALL_TELEMETRY_PROJECT_ALIASES:}
  ask:
    memory-index: ${SBA_ASK_MEMORY_INDEX:agent-memory}
    vector-field: ${SBA_ASK_VECTOR_FIELD:vector}
    embedding-enabled: ${SBA_ASK_EMBEDDING_ENABLED:true}
    embedding-base-url: ${SBA_ASK_EMBEDDING_URL:http://localhost:11434}
    embedding-path: ${SBA_ASK_EMBEDDING_PATH:/api/embeddings}
    embedding-model: ${SBA_ASK_EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimensions: ${SBA_ASK_EMBEDDING_DIMENSIONS:768}
    embedding-timeout: 5s
    default-ask-citations: ${SBA_ASK_DEFAULT_CITATIONS:6}
    default-retrieve-results: ${SBA_ASK_DEFAULT_RETRIEVE_RESULTS:10}
    answer-max-tokens: ${SBA_ASK_ANSWER_MAX_TOKENS:640}
  ingestion:
    max-text-length: 20000
    # Secret-looking values (private key blocks, bearer/API keys, AWS credentials, and password/token
    # assignments) are replaced with [REDACTED] before persistence.
    redact-enabled: ${SBA_REDACT_ENABLED:true}
  judge:
    enabled: ${SBA_JUDGE_ENABLED:false}
    provider: ${SBA_JUDGE_PROVIDER:jev}
    max-others: ${SBA_JUDGE_MAX_OTHERS:8}
    timeout-ms: ${SBA_JUDGE_TIMEOUT_MS:12000}
    beat:
      gap-ms: ${SBA_JUDGE_BEAT_GAP_MS:4000}
      max-events: ${SBA_JUDGE_BEAT_MAX_EVENTS:12}
      max-chars: ${SBA_JUDGE_BEAT_MAX_CHARS:1500}

---
# Keep SQLite driver properties off the PostgreSQL connection pool.
spring:
  config:
    activate:
      on-profile: '!postgres'
  datasource:
    url: ${SBA_DATASOURCE_URL:jdbc:sqlite:sba-agentic.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # WAL (set once at startup) lets several connections read while one writes; a pool of a few
      # connections plus a busy_timeout means concurrent agents can capture without blocking the UI,
      # and the rare writer-vs-writer overlap waits briefly instead of erroring.
      maximum-pool-size: 4
      connection-test-query: SELECT 1
      # xerial applies driver properties whenever Hikari creates a physical connection. SQLite's
      # connection-local settings need to be applied to every physical connection.
      data-source-properties:
        foreign_keys: "true"
        busy_timeout: "5000"
