# Zero-egress local profile (--spring.profiles.active=offline or SPRING_PROFILES_ACTIVE=offline).
# Disables external CLI summaries, local LLM endpoints, embedding calls, and Elasticsearch.
sba:
  summary:
    backend: local
  local-ai:
    enabled: false
  memory:
    embedding:
      enabled: false
  ask:
    embedding-enabled: false
  elasticsearch:
    enabled: false
  continuation:
    synthesis:
      enabled: false
